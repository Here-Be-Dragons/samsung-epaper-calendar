# Builds the container image for Intel/AMD and ARM (a Raspberry Pi or Home Assistant Yellow) and publishes it to the
# GitHub Container Registry as ghcr.io/<owner>/<repo>. It runs when you push a version tag (git tag v0.1.0 && git push origin v0.1.0)
# or by hand from the Actions tab. A tag v1.2.3 publishes 1.2.3, 1.2 and latest.
#
# After the first publish, open the package's settings on GitHub once and set its visibility to Public, so others can pull it.
name: Container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
