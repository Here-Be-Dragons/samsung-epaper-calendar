services:
  samsung-epaper-calendar:
    # The published multi-arch image (Intel/AMD and ARM). Until it exists, or after `docker compose up --build`, this builds from the
    # Dockerfile instead.
    image: ghcr.io/here-be-dragons/samsung-epaper-calendar:latest
    build: .
    container_name: samsung-epaper-calendar
    restart: unless-stopped
    # Host networking (Linux): the panel fetches its pictures from this machine's own LAN address, and a
    # Wake-on-LAN broadcast has to leave on your LAN. The server listens on PORT from .env (default 8080).
    # On Docker Desktop (Mac or Windows) remove this line, add
    #   ports: ["${PORT:-8080}:${PORT:-8080}"]
    # and set PUBLIC_HOST in .env to this machine's LAN IP.
    network_mode: host
    # Settings come from .env (copy .env.example); nothing is set here, so nothing here can silently
    # override it. The calendars (and optionally several displays) come from config/config.yaml, mounted
    # below (copy config/config.example.yaml). (STATE_FILE is the one default: see below.)
    env_file:
      - path: .env
        required: false
    environment:
      # Remembers what the panel shows (and its battery history) across restarts.
      - STATE_FILE=${STATE_FILE:-/data/state.json}
    volumes:
      - calendar-data:/data
      # The folder, not the file, so Docker never turns a missing config.yaml into a directory. Without a
      # config file the calendars come from CALENDARS / CALENDAR_<ID>_* in .env instead.
      - ./config:/config:ro
      # For SHOPPING_SOURCE=file, mount the list so you can edit it on the host:
      #   - ./shopping.json:/data/shopping.json:ro      (then SHOPPING_FILE=/data/shopping.json)

volumes:
  calendar-data:
